# Panel de Reconocimiento Facial — acceso por IP:8090 (despliegue Fase 5).
# Plantilla: deploy/install_apache.sh sustituye __PHP_FPM_SOCK__ por el socket
# php-fpm disponible en la máquina (php8.4 en prod, php8.3 en dev).
Listen 8090

<VirtualHost *:8090>
    ServerName localhost
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html

    <FilesMatch \.php$>
         SetHandler "proxy:unix:__PHP_FPM_SOCK__|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/>
        Options FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # Seguridad: no exponer .git ni ficheros de configuración
    RedirectMatch 404 /\.git
    <Files ~ "\.(env|log|out|sql|pkl)$">
        Require all denied
    </Files>

    # En Directo: streaming local RTSP->MJPEG (live/mjpeg-stream.js, escucha en 127.0.0.1:8084)
    ProxyPass /reconocimientoFacial/live http://127.0.0.1:8084/live
    ProxyPassReverse /reconocimientoFacial/live http://127.0.0.1:8084/live

    CustomLog ${APACHE_LOG_DIR}/rf-panel_access.log combined
    ErrorLog ${APACHE_LOG_DIR}/rf-panel_error.log
</VirtualHost>
