# Drop-in de Ollama (worker VLM local) — gestionado por systemd.
#
# Motivo (incidente 2026-09-25): la unit de distro corre como `User=ollama`
# con HOME=/usr/share/ollama y NO ve los modelos de /root/.ollama. En
# producción alguien acabó lanzando un `ollama serve` manual como root que
# ocupaba :11434; la unit de systemd fallaba con "address already in use" y
# entró en bucle (52.913 reinicios). Además el worker quedó colgado.
#
# Este drop-in fija la instancia CORRECTA (root + store de root) para que
# systemd sea el único dueño de ollama. Lo instala deploy/install_services.sh.
[Service]
User=root
Group=root
Environment=HOME=/root
Environment=OLLAMA_MODELS=/root/.ollama/models
