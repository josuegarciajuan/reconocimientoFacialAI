# rf-ojos-public.conf — se incluye SOLO dentro de los vhosts de josue.ink.
# Todo /ojos pasa por el gate de patrón; el backend real está en 8088.
ProxyPass /ojos/live http://127.0.0.1:8099/ojos/live flushpackets=on
ProxyPassReverse /ojos/live http://127.0.0.1:8099/ojos/live
ProxyPass /ojos http://127.0.0.1:8099/ojos
ProxyPassReverse /ojos http://127.0.0.1:8099/ojos
RedirectMatch 301 ^/ojos/?$ /ojos/admin/

<LocationMatch "^/ojos(/|$)">
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Cache-Control "no-store"
</LocationMatch>
