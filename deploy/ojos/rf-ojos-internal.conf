# rf-ojos-internal.conf — backend PHP de `ojos`, solo loopback.
# El panel-gate (127.0.0.1:8099) enruta /ojos aquí. No escucha en IP pública.
Listen 127.0.0.1:8088

<VirtualHost 127.0.0.1:8088>
    ServerName ojos.internal
    DocumentRoot /var/www/html/josue

    <FilesMatch \.php$>
         SetHandler "proxy:unix:/run/php/php8.3-fpm-ojos.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/html/josue>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Mismo código que laboral; pool PHP-FPM, sesiones y datos de `ojos`.
    Alias /ojos /root/reconocimientoFacial
    <Directory /root/reconocimientoFacial>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        DirectoryIndex index.php
        Require all granted
    </Directory>

    # La raíz /ojos/ no tiene panel: redirigir siempre al panel real.
    RedirectMatch 301 ^/ojos/?$ /ojos/admin/

    # Streaming MJPEG de la instancia personal (rf-live en 127.0.0.1:8084).
    ProxyPass /ojos/live http://127.0.0.1:8084/live flushpackets=on
    ProxyPassReverse /ojos/live http://127.0.0.1:8084/live

    CustomLog ${APACHE_LOG_DIR}/ojos_internal_access.log combined
    ErrorLog ${APACHE_LOG_DIR}/ojos_internal_error.log
</VirtualHost>
