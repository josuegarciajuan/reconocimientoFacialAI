; Pool PHP-FPM de la instancia personal `ojos` (liveyourdre2).
; Se instala en /etc/php/8.3/fpm/pool.d/ojos.conf y escucha solo en su socket.
[ojos]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-ojos.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; La instancia se identifica por entorno; el .env sigue viviendo en la raíz
; del proyecto (gitignored) igual que en laboral.
env[RF_INSTANCE] = ojos
env[RF_BASE_PATH] = /ojos/

; Sesiones aisladas de /reconocimientoFacial y de /rf.
php_admin_value[session.name] = OJOSSESSID
php_admin_value[session.cookie_path] = /ojos/
php_admin_value[session.cookie_secure] = On
php_admin_value[session.cookie_httponly] = On
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.save_path] = /var/lib/php/sessions-ojos

catch_workers_output = yes
decorate_workers_output = no
